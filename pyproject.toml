[project]
name = "payment-cascading"
version = "0.1.0"
description = "A small payment cascading demonstration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "stripe>=12,<15",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
